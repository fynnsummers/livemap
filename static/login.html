<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Livemap · Anmelden</title>
  <meta name="theme-color" content="#212428">
  <script>
    try {
      document.documentElement.dataset.theme = localStorage.getItem("livemap.theme") === "light" ? "light" : "dark";
    } catch (err) { /* ignore */ }
  </script>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="/favicon.png?v=4" type="image/png">
  <link rel="stylesheet" href="/app.css?v=52">
</head>
<body class="login-page">
  <canvas id="loginMap" class="login-map" aria-hidden="true"></canvas>
  <div class="login-veil" aria-hidden="true"></div>
  <header>
    <a class="brand" href="/login">
      <img class="brand-logo logo-for-dark" src="/logo-dark.png?v=5" alt="Livemap">
      <img class="brand-logo logo-for-light" src="/logo.png?v=5" alt="">
    </a>
  </header>
  <div class="login-hero">
    <img class="login-hero-logo logo-for-dark" src="/logo-dark.png?v=5" alt="Livemap">
    <img class="login-hero-logo logo-for-light" src="/logo.png?v=5" alt="">
    <p>Livemap zeigt Zugriffe und Angriffe auf den eigenen Server live auf einer Weltkarte. Du siehst, woher sie kommen, wann sie kommen und was passiert. Die Software ist Open Source.</p>
    <a class="github-btn" href="https://github.com/fynnsummers/livemap" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82A7.7 7.7 0 0 1 8 3.87c.68.003 1.36.092 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
      GitHub
    </a>
  </div>
  <div class="login-show" aria-hidden="true"></div>
  <main class="login-main">
    <section class="login-panel">
      <aside class="login-host">
        <p class="login-kicker">Host</p>
        <h2 id="hostName">…</h2>
        <dl>
          <dt>Hostname</dt>
          <dd id="hostHostname">…</dd>
          <dt>Anbieter</dt>
          <dd id="hostHoster">…</dd>
          <dt>Standort</dt>
          <dd id="hostPlace">…</dd>
        </dl>
      </aside>
      <form class="login-form" id="loginForm" autocomplete="on">
        <h2>Anmelden</h2>
        <label>Benutzer
          <input id="username" name="username" autocomplete="username" required autofocus>
        </label>
        <label>Passwort
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </label>
        <div class="login-row">
          <button type="submit" class="solid" id="submitBtn">Einloggen</button>
          <p class="login-error" id="error" role="alert"></p>
        </div>
      </form>
    </section>
  </main>
  <footer class="login-foot">© 2026 Livemap</footer>
  <script>
    const form = document.getElementById("loginForm");
    const error = document.getElementById("error");
    const btn = document.getElementById("submitBtn");
    form.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      error.textContent = "";
      btn.disabled = true;
      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({
            username: document.getElementById("username").value.trim(),
            password: document.getElementById("password").value,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) {
          error.textContent = data.error || "Login fehlgeschlagen";
          btn.disabled = false;
          return;
        }
        location.href = "/";
      } catch (err) {
        error.textContent = "Netzwerkfehler";
        btn.disabled = false;
      }
    });

    const canvas = document.getElementById("loginMap");
    const ctx = canvas.getContext("2d");
    const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const target = { lon: 13.405, lat: 52.52 };
    const origins = [
      ["Shanghai", 121.47, 31.23],
      ["Singapur", 103.85, 1.29],
      ["Tokio", 139.69, 35.69],
      ["Mumbai", 72.88, 19.08],
      ["Sydney", 151.21, -33.87],
      ["São Paulo", -46.63, -23.55],
      ["New York", -74.01, 40.71],
      ["Lagos", 3.38, 6.52],
      ["Moskau", 37.62, 55.76],
      ["London", -0.13, 51.51],
      ["Johannesburg", 28.05, -26.2],
      ["Seoul", 126.98, 37.57],
      ["Istanbul", 28.98, 41.01],
      ["Los Angeles", -118.24, 34.05],
      ["Jakarta", 106.85, -6.21],
      ["Kairo", 31.24, 30.04],
      ["Toronto", -79.38, 43.65],
      ["Bangkok", 100.5, 13.76],
      ["Mexiko-Stadt", -99.13, 19.43],
      ["Dubai", 55.27, 25.2],
      ["Paris", 2.35, 48.86],
      ["Buenos Aires", -58.38, -34.6],
    ];
    const colors = ["#c24b3c", "#c9a24a", "#6d8ea3", "#a86b52", "#8b949e"];
    let features = [];
    let mapLayer = null;
    let mapKey = "";
    let viewW = 0;
    let viewH = 0;
    const flights = [];
    const impacts = [];
    let originIndex = 0;
    let spawnAt = 0;

    function placeText(id, value) {
      const el = document.getElementById(id);
      if (el) el.textContent = value || "—";
    }

    function formatPlace(lat, lon) {
      if (!Number.isFinite(lat) || !Number.isFinite(lon)) return "—";
      const ns = lat >= 0 ? "N" : "S";
      const ew = lon >= 0 ? "E" : "W";
      return `${Math.abs(lat).toFixed(2)}° ${ns}, ${Math.abs(lon).toFixed(2)}° ${ew}`;
    }

    fetch("/api/host", { credentials: "same-origin" })
      .then((res) => res.ok ? res.json() : null)
      .then((data) => {
        if (!data) return;
        placeText("hostName", data.name || data.hostname);
        placeText("hostHostname", data.hostname);
        placeText("hostHoster", data.hoster);
        if (Number.isFinite(data.lat) && Number.isFinite(data.lon)) {
          target.lat = data.lat;
          target.lon = data.lon;
          mapKey = "";
        }
        placeText("hostPlace", formatPlace(target.lat, target.lon));
      })
      .catch(() => {});

    function project(lon, lat, box) {
      return [
        box.x + ((lon + 180) / 360) * box.w,
        box.y + ((90 - lat) / 180) * box.h,
      ];
    }

    function viewBox() {
      const w = canvas.width;
      const h = canvas.height;
      let bw = w;
      let bh = bw / 2;
      if (bh < h) {
        bh = h;
        bw = bh * 2;
      }
      return { x: (w - bw) / 2, y: (h - bh) / 2, w: bw, h: bh };
    }

    function resize() {
      const rect = canvas.getBoundingClientRect();
      const dpr = Math.min(2, devicePixelRatio || 1);
      const width = Math.max(1, Math.floor(rect.width * dpr));
      const height = Math.max(1, Math.floor(rect.height * dpr));
      if (width === viewW && height === viewH) return;
      viewW = width;
      viewH = height;
      canvas.width = width;
      canvas.height = height;
      mapKey = "";
    }

    function traceGeometry(geometry, box, context) {
      const polys = geometry.type === "Polygon" ? [geometry.coordinates] : geometry.coordinates;
      for (const poly of polys) {
        for (const ring of poly) {
          let open = false;
          let prev = null;
          for (const pair of ring) {
            const lon = pair[0];
            const lat = pair[1];
            if (prev && Math.abs(lon - prev[0]) > 180) {
              if (open) context.closePath();
              open = false;
            }
            const point = project(lon, lat, box);
            if (!open) {
              context.moveTo(point[0], point[1]);
              open = true;
            } else context.lineTo(point[0], point[1]);
            prev = pair;
          }
          if (open) context.closePath();
        }
      }
    }

    function demoPaint() {
      const light = document.documentElement.dataset.theme === "light";
      return light
        ? { sea: "#e7edf2", land: "#c5d0da", grid: "rgba(90, 104, 118, 0.28)", stroke: "rgba(70, 84, 98, 0.4)" }
        : { sea: "#1d2023", land: "#4c5662", grid: "rgba(140, 155, 170, 0.18)", stroke: "rgba(170, 185, 200, 0.32)" };
    }

    function ensureMap(box) {
      const paint = demoPaint();
      const key = `${canvas.width}x${canvas.height}|${box.x},${box.y},${box.w},${box.h}|${document.documentElement.dataset.theme || "dark"}`;
      if (mapLayer && mapKey === key) return;
      mapKey = key;
      if (!mapLayer) mapLayer = document.createElement("canvas");
      if (mapLayer.width !== canvas.width || mapLayer.height !== canvas.height) {
        mapLayer.width = canvas.width;
        mapLayer.height = canvas.height;
      }
      const g = mapLayer.getContext("2d");
      g.setTransform(1, 0, 0, 1, 0, 0);
      g.clearRect(0, 0, mapLayer.width, mapLayer.height);
      g.fillStyle = paint.sea;
      g.fillRect(0, 0, mapLayer.width, mapLayer.height);
      g.strokeStyle = paint.grid;
      g.lineWidth = 1;
      g.beginPath();
      for (let lon = -180; lon <= 180; lon += 30) {
        const x = project(lon, 0, box)[0];
        g.moveTo(x, box.y);
        g.lineTo(x, box.y + box.h);
      }
      for (let lat = -60; lat <= 60; lat += 30) {
        const y = project(0, lat, box)[1];
        g.moveTo(box.x, y);
        g.lineTo(box.x + box.w, y);
      }
      g.stroke();
      g.fillStyle = paint.land;
      g.strokeStyle = paint.stroke;
      g.lineWidth = 0.8;
      for (const feature of features) {
        g.beginPath();
        traceGeometry(feature.geometry, box, g);
        g.fill();
        g.stroke();
      }
    }

    function quad(a, c, b, t) {
      const u = 1 - t;
      return [
        u * u * a[0] + 2 * u * t * c[0] + t * t * b[0],
        u * u * a[1] + 2 * u * t * c[1] + t * t * b[1],
      ];
    }

    function spawn(now) {
      const origin = origins[originIndex % origins.length];
      const color = colors[originIndex % colors.length];
      originIndex += 1;
      flights.push({
        lon: origin[1],
        lat: origin[2],
        color,
        t0: now,
        dur: 980 + (originIndex % 6) * 160,
      });
      if (flights.length > 40) flights.splice(0, flights.length - 40);
    }

    function drawFlight(from, to, color, progress) {
      const mx = (from[0] + to[0]) / 2;
      const my = (from[1] + to[1]) / 2;
      const len = Math.hypot(to[0] - from[0], to[1] - from[1]) || 1;
      const lift = Math.min(90, len * 0.18);
      const control = [mx, my - lift];
      const steps = 28;
      const end = Math.max(2, Math.floor(steps * progress));
      ctx.beginPath();
      for (let i = 0; i <= end; i += 1) {
        const p = quad(from, control, to, i / steps);
        if (i === 0) ctx.moveTo(p[0], p[1]);
        else ctx.lineTo(p[0], p[1]);
      }
      ctx.strokeStyle = color;
      ctx.globalAlpha = 0.72;
      ctx.lineWidth = 1.6;
      ctx.stroke();
      const head = quad(from, control, to, progress);
      ctx.globalAlpha = 0.95;
      ctx.fillStyle = color;
      ctx.fillRect(head[0] - 2.2, head[1] - 2.2, 4.4, 4.4);
      ctx.globalAlpha = 1;
    }

    function frame(now) {
      resize();
      const box = viewBox();
      ensureMap(box);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (mapLayer) ctx.drawImage(mapLayer, 0, 0);
      const dest = project(target.lon, target.lat, box);
      if (!reduced) {
        if (now - spawnAt > 110) {
          spawnAt = now;
          spawn(now);
          if (originIndex % 3 === 0) spawn(now);
        }
        for (let i = flights.length - 1; i >= 0; i -= 1) {
          const flight = flights[i];
          const t = (now - flight.t0) / flight.dur;
          if (t >= 1) {
            impacts.push({ x: dest[0], y: dest[1], t0: now, color: flight.color });
            flights.splice(i, 1);
            continue;
          }
          const from = project(flight.lon, flight.lat, box);
          drawFlight(from, dest, flight.color, Math.min(1, t));
        }
        for (let i = impacts.length - 1; i >= 0; i -= 1) {
          const hit = impacts[i];
          const age = (now - hit.t0) / 700;
          if (age >= 1) {
            impacts.splice(i, 1);
            continue;
          }
          ctx.beginPath();
          ctx.strokeStyle = hit.color;
          ctx.globalAlpha = 1 - age;
          ctx.lineWidth = 1.2;
          ctx.arc(hit.x, hit.y, 4 + age * 16, 0, Math.PI * 2);
          ctx.stroke();
          ctx.globalAlpha = 1;
        }
      }
      ctx.fillStyle = "#d8dde3";
      ctx.fillRect(dest[0] - 3.5, dest[1] - 3.5, 7, 7);
      ctx.strokeStyle = "#9aa3ad";
      ctx.strokeRect(dest[0] - 3.5, dest[1] - 3.5, 7, 7);
      if (!reduced) requestAnimationFrame(frame);
    }

    fetch("/world.geojson")
      .then((res) => res.ok ? res.json() : null)
      .then((data) => {
        features = data && data.features ? data.features : [];
        mapKey = "";
        requestAnimationFrame(frame);
      })
      .catch(() => requestAnimationFrame(frame));
  </script>
</body>
</html>
