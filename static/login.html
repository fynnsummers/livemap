<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Livemap · Anmelden</title>
  <meta name="theme-color" content="#0f1216">
  <script>
    try {
      document.documentElement.dataset.theme = localStorage.getItem("livemap.theme") === "light" ? "light" : "dark";
    } catch (err) { /* ignore */ }
  </script>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="/favicon.png?v=4" type="image/png">
  <link rel="stylesheet" href="/app.css?v=1.0.11">
</head>
<body class="login-concept">
  <canvas id="loginMap" class="login-map" aria-hidden="true"></canvas>
  <div class="login-veil" aria-hidden="true"></div>
  <main class="login-stage">
    <a class="login-brand" href="/login">
      <img class="logo-for-dark" src="/logo-dark.png?v=5" alt="Livemap">
      <img class="logo-for-light" src="/logo.png?v=5" alt="">
    </a>
    <section class="login-card">
      <h1>Anmelden</h1>
      <p class="login-lead">Melde dich an, um Livemap zu nutzen.</p>
      <form class="login-form" id="loginForm" autocomplete="on">
        <label class="field">
          <span>Benutzername</span>
          <span class="field-box">
            <svg class="field-icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="5.2" r="2.3" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M3.2 13.2c.7-2.3 2.3-3.4 4.8-3.4s4.1 1.1 4.8 3.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
            <input id="username" name="username" autocomplete="username" required autofocus>
          </span>
        </label>
        <label class="field">
          <span>Passwort</span>
          <span class="field-box">
            <svg class="field-icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="3.2" y="7" width="9.6" height="6.2" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M5.3 7V5.2a2.7 2.7 0 0 1 5.4 0V7" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="button" class="field-eye" id="passwordToggle" aria-label="Passwort zeigen">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.4 8S3.8 4.2 8 4.2 14.6 8 14.6 8 12.2 11.8 8 11.8 1.4 8 1.4 8z" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="8" r="1.7" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
            </button>
          </span>
        </label>
        <label class="remember">
          <input id="remember" type="checkbox" checked>
          <span>Angemeldet bleiben</span>
        </label>
        <button type="submit" id="submitBtn">Einloggen</button>
        <p class="login-error" id="error" role="alert"></p>
      </form>
    </section>
    <div class="login-below">
      <p class="login-os-title">Open Source</p>
      <p class="login-os">Livemap ist Open Source und wird von der Community entwickelt.</p>
      <a class="github-btn" href="https://github.com/fynnsummers/livemap" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82A7.7 7.7 0 0 1 8 3.87c.68.003 1.36.092 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        GitHub
      </a>
      <p class="login-foot">© 2026 Livemap</p>
    </div>
  </main>
  <aside class="login-host" id="loginHost" hidden>
    <p id="hostName"></p>
    <p id="hostHostname" hidden></p>
    <p id="hostHoster"></p>
    <p id="hostPlace"></p>
  </aside>
  <script>
    document.getElementById("passwordToggle").addEventListener("click", () => {
      const input = document.getElementById("password");
      const show = input.type === "password";
      input.type = show ? "text" : "password";
      const toggle = document.getElementById("passwordToggle");
      toggle.classList.toggle("is-open", show);
      toggle.setAttribute("aria-label", show ? "Passwort verbergen" : "Passwort zeigen");
    });

    const form = document.getElementById("loginForm");
    const error = document.getElementById("error");
    const btn = document.getElementById("submitBtn");
    form.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      error.textContent = "";
      btn.disabled = true;
      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({
            username: document.getElementById("username").value.trim(),
            password: document.getElementById("password").value,
            remember: document.getElementById("remember").checked,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) {
          error.textContent = data.error || "Login fehlgeschlagen";
          btn.disabled = false;
          return;
        }
        location.href = "/";
      } catch (err) {
        error.textContent = "Netzwerkfehler";
        btn.disabled = false;
      }
    });
  </script>
  <script src="/login-demo.js?v=1"></script>
</body>
</html>
