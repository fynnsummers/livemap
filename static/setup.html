<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Livemap · Einrichtung</title>
  <meta name="theme-color" content="#0f1216">
  <script>
    try {
      document.documentElement.dataset.theme = localStorage.getItem("livemap.theme") === "light" ? "light" : "dark";
    } catch (err) { /* ignore */ }
  </script>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="/favicon.png?v=4" type="image/png">
  <link rel="stylesheet" href="/app.css?v=1.0.12">
</head>
<body class="login-concept">
  <canvas id="loginMap" class="login-map" aria-hidden="true"></canvas>
  <div class="login-veil" aria-hidden="true"></div>
  <main class="login-stage">
    <a class="login-brand" href="/setup">
      <img class="logo-for-dark" src="/logo-dark.png?v=5" alt="Livemap">
      <img class="logo-for-light" src="/logo.png?v=5" alt="">
    </a>
    <section class="login-card" id="setupCard">
      <h1>Einrichtung</h1>
      <p class="login-lead" id="stepLabel">Schritt 1 von 3</p>
      <form class="setup-form" id="setupForm" autocomplete="off">
        <div class="stepbar" aria-hidden="true"><span id="stepFill"></span></div>

        <div data-step="1">
          <p class="setup-note">Der Einrichtungscode steht nur auf dem Server, in <code>data/setup.code</code> und in der Ausgabe des Dienstes. Damit kann niemand sonst das Konto anlegen.</p>
          <label class="field plain">
            <span>Einrichtungscode</span>
            <span class="field-box">
              <input id="code" name="code" autocomplete="off" required>
            </span>
          </label>
        </div>

        <div data-step="2" hidden>
          <label class="field plain">
            <span>Benutzer</span>
            <span class="field-box">
              <input id="username" name="username" autocomplete="username" spellcheck="false">
            </span>
          </label>
          <label class="field plain">
            <span>Passwort</span>
            <span class="field-box">
              <input id="password" name="password" type="password" autocomplete="new-password">
            </span>
          </label>
          <div class="pw-meter" id="pwMeter" data-rank=""><span></span></div>
          <p class="pw-label" id="pwLabel"></p>
          <label class="field plain">
            <span>Wiederholen</span>
            <span class="field-box">
              <input id="again" name="again" type="password" autocomplete="new-password">
            </span>
          </label>
          <p class="setup-note">Der Balken muss Good oder Strong erreichen. Mindestens 12 Zeichen, drei Zeichenarten, nicht der Benutzername.</p>
        </div>

        <div data-step="3" hidden>
          <label class="field plain">
            <span>Name</span>
            <span class="field-box">
              <input id="serverName" name="name" maxlength="60">
            </span>
          </label>
          <label class="field plain">
            <span>Anbieter</span>
            <div class="hoster-pick" id="hosterPick">
              <span class="field-box">
                <svg class="field-icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M10.2 10.2 13.2 13.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
                <input id="hosterSearch" type="text" placeholder="Suchen..." autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="hosterList" aria-autocomplete="list">
                <img id="hosterIcon" class="hoster-chosen" alt="" hidden>
              </span>
              <div class="hoster-menu" id="hosterMenu" hidden>
                <div id="hosterList" role="listbox"></div>
              </div>
              <input type="hidden" id="serverHoster" name="hoster" value="">
            </div>
          </label>
          <div class="setup-pair">
            <label class="field plain">
              <span>Breite</span>
              <span class="field-box">
                <input id="serverLat" name="lat" inputmode="decimal">
              </span>
            </label>
            <label class="field plain">
              <span>Länge</span>
              <span class="field-box">
                <input id="serverLon" name="lon" inputmode="decimal">
              </span>
            </label>
          </div>
        </div>

        <div class="setup-actions">
          <button type="button" id="backBtn" hidden>Zurück</button>
          <button type="button" id="nextBtn">Weiter</button>
        </div>
        <p class="login-error" id="error" role="alert"></p>
      </form>
    </section>
  </main>
  <aside class="login-host" id="loginHost" hidden>
    <p id="hostName"></p>
    <p id="hostHostname" hidden></p>
    <p id="hostHoster"></p>
    <p id="hostPlace"></p>
  </aside>
  <script src="/login-demo.js?v=1"></script>
  <script>
    const form = document.getElementById("setupForm");
    const card = document.getElementById("setupCard");
    const error = document.getElementById("error");
    const nextBtn = document.getElementById("nextBtn");
    const backBtn = document.getElementById("backBtn");
    const stepFill = document.getElementById("stepFill");
    const stepLabel = document.getElementById("stepLabel");
    const pwMeter = document.getElementById("pwMeter");
    const pwLabel = document.getElementById("pwLabel");
    const common = new Set(["password","password1","password123","changeme","livemap","admin","admin123","qwerty","qwerty123","letmein","welcome","iloveyou","12345678","123456789","1234567890","passw0rd","abc12345","secret","secret123"]);
    let step = 1;

    function rankPassword(pw, username) {
      const labels = ["Too short", "Weak", "Fair", "Good", "Strong"];
      if (pw.length < 12) return [0, labels[0]];
      const low = pw.toLowerCase();
      const user = username.trim().toLowerCase();
      if (common.has(low) || (user && (low === user || low.includes(user)))) return [1, labels[1]];
      const classes = [/[a-z]/, /[A-Z]/, /\d/, /[^A-Za-z0-9]/].filter((re) => re.test(pw)).length;
      if (classes < 2) return [1, labels[1]];
      if (classes === 2) return [2, labels[2]];
      if (pw.length < 16) return [3, labels[3]];
      return [4, labels[4]];
    }

    function paintMeter() {
      const pw = document.getElementById("password").value;
      if (!pw) {
        pwMeter.dataset.rank = "";
        pwLabel.textContent = "";
        return;
      }
      const [rank, label] = rankPassword(pw, document.getElementById("username").value);
      pwMeter.dataset.rank = String(rank);
      pwLabel.textContent = label;
    }

    function showStep(next) {
      step = next;
      error.textContent = "";
      document.querySelectorAll("[data-step]").forEach((el) => {
        el.hidden = Number(el.dataset.step) !== step;
      });
      stepFill.style.width = `${step / 3 * 100}%`;
      stepLabel.textContent = `Schritt ${step} von 3`;
      backBtn.hidden = step === 1;
      nextBtn.textContent = step === 3 ? "Fertig" : "Weiter";
      nextBtn.disabled = false;
    }

    document.getElementById("password").addEventListener("input", paintMeter);
    document.getElementById("username").addEventListener("input", paintMeter);

    async function post(url, body) {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "same-origin",
        body: JSON.stringify(body),
      });
      const data = await res.json().catch(() => ({}));
      return { res, data };
    }

    nextBtn.addEventListener("click", async () => {
      error.textContent = "";
      nextBtn.disabled = true;
      try {
        if (step === 1) {
          const { res, data } = await post("/api/setup/code", { code: document.getElementById("code").value.trim() });
          if (!res.ok) {
            error.textContent = data.error || "Einrichtungscode stimmt nicht";
            nextBtn.disabled = false;
            return;
          }
          showStep(2);
          return;
        }
        if (step === 2) {
          const username = document.getElementById("username").value.trim();
          const password = document.getElementById("password").value;
          const again = document.getElementById("again").value;
          if (!/^[A-Za-z][A-Za-z0-9_-]{2,31}$/.test(username)) {
            error.textContent = "Benutzer: Buchstabe, dann 2 bis 31 Zeichen aus Buchstaben, Ziffern, _ oder -";
            nextBtn.disabled = false;
            return;
          }
          const [rank] = rankPassword(password, username);
          if (rank < 3) {
            error.textContent = "Passwort ist zu schwach";
            nextBtn.disabled = false;
            return;
          }
          if (password !== again) {
            error.textContent = "Passwörter stimmen nicht überein";
            nextBtn.disabled = false;
            return;
          }
          showStep(3);
          return;
        }
        const { res, data } = await post("/api/setup", {
          code: document.getElementById("code").value.trim(),
          username: document.getElementById("username").value.trim(),
          password: document.getElementById("password").value,
          again: document.getElementById("again").value,
          name: document.getElementById("serverName").value.trim(),
          hoster: document.getElementById("serverHoster").value,
          lat: document.getElementById("serverLat").value.trim(),
          lon: document.getElementById("serverLon").value.trim(),
        });
        if (!res.ok || !data.ok) {
          error.textContent = data.error || "Einrichtung fehlgeschlagen";
          nextBtn.disabled = false;
          return;
        }
        card.innerHTML = '<h1>Fertig! Sie können loslegen</h1><p class="login-lead">Das Konto ist bereit.</p><a class="setup-go" href="/">Livemap öffnen</a>';
      } catch (err) {
        error.textContent = "Netzwerkfehler";
        nextBtn.disabled = false;
      }
    });

    backBtn.addEventListener("click", () => {
      if (step > 1) showStep(step - 1);
    });

    fetch("/api/setup", { credentials: "same-origin" })
      .then((res) => res.ok ? res.json() : null)
      .then((data) => {
        if (!data) return;
        if (!data.needed) {
          location.href = "/login";
          return;
        }
        if (data.name) document.getElementById("serverName").value = data.name;
        if (data.hoster) selectHoster(data.hoster);
        if (Number.isFinite(data.lat)) document.getElementById("serverLat").value = String(data.lat);
        if (Number.isFinite(data.lon)) document.getElementById("serverLon").value = String(data.lon);
      })
      .catch(() => {});

    const HOSTERS = [
      ["akamai", "Akamai"],
      ["alibaba", "Alibaba"],
      ["amazon", "Amazon"],
      ["apple", "Apple"],
      ["cloudflare", "Cloudflare"],
      ["contabo", "Contabo"],
      ["digitalocean", "DigitalOcean"],
      ["fastly", "Fastly"],
      ["github", "GitHub"],
      ["godaddy", "GoDaddy"],
      ["google", "Google"],
      ["hetzner", "Hetzner"],
      ["ionos", "IONOS"],
      ["leaseweb", "Leaseweb"],
      ["linode", "Linode"],
      ["meta", "Meta"],
      ["microsoft", "Microsoft"],
      ["oracle", "Oracle"],
      ["ovh", "OVH"],
      ["rackspace", "Rackspace"],
      ["strato", "Strato"],
      ["tencent", "Tencent"],
      ["vultr", "Vultr"],
    ];

    function hosterBySlug(slug) {
      return HOSTERS.find((item) => item[0] === slug) || null;
    }

    function syncHosterChrome() {
      const hidden = document.getElementById("serverHoster");
      const input = document.getElementById("hosterSearch");
      const icon = document.getElementById("hosterIcon");
      const found = hosterBySlug(hidden.value);
      const show = found && input.value.trim().toLowerCase() === found[1].toLowerCase();
      icon.hidden = !show;
      if (show) icon.src = `/marks/${found[0]}.svg`;
    }

    function selectHoster(slug) {
      const found = hosterBySlug(slug);
      const hidden = document.getElementById("serverHoster");
      const input = document.getElementById("hosterSearch");
      hidden.value = found ? found[0] : "";
      input.value = found ? found[1] : "";
      syncHosterChrome();
      document.querySelectorAll("#hosterList button").forEach((btn) => {
        btn.classList.toggle("is-selected", btn.dataset.slug === hidden.value);
      });
    }

    function paintHosters(query) {
      const list = document.getElementById("hosterList");
      const selected = document.getElementById("serverHoster").value;
      const found = hosterBySlug(selected);
      const raw = (query || "").trim().toLowerCase();
      const needle = found && raw === found[1].toLowerCase() ? "" : raw;
      list.replaceChildren();
      const rows = HOSTERS.filter((item) => item[1].toLowerCase().includes(needle) || item[0].includes(needle));
      if (!rows.length) {
        const empty = document.createElement("p");
        empty.className = "hoster-empty";
        empty.textContent = "Kein Anbieter";
        list.append(empty);
        return;
      }
      for (const [slug, name] of rows) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.dataset.slug = slug;
        btn.className = slug === selected ? "is-selected" : "";
        btn.setAttribute("role", "option");
        const img = document.createElement("img");
        img.src = `/marks/${slug}.svg`;
        img.alt = "";
        const text = document.createElement("span");
        text.textContent = name;
        btn.append(img, text);
        btn.addEventListener("mousedown", (event) => event.preventDefault());
        btn.addEventListener("click", () => {
          selectHoster(slug);
          closeHoster();
        });
        list.append(btn);
      }
    }

    function openHoster() {
      const menu = document.getElementById("hosterMenu");
      const input = document.getElementById("hosterSearch");
      menu.hidden = false;
      input.setAttribute("aria-expanded", "true");
      paintHosters(input.value);
      const found = hosterBySlug(document.getElementById("serverHoster").value);
      if (found && input.value === found[1]) input.select();
    }

    function closeHoster() {
      const menu = document.getElementById("hosterMenu");
      const input = document.getElementById("hosterSearch");
      menu.hidden = true;
      input.setAttribute("aria-expanded", "false");
      const found = hosterBySlug(document.getElementById("serverHoster").value);
      input.value = found ? found[1] : "";
      syncHosterChrome();
    }

    const hosterSearch = document.getElementById("hosterSearch");
    hosterSearch.addEventListener("focus", openHoster);
    hosterSearch.addEventListener("click", () => {
      if (document.getElementById("hosterMenu").hidden) openHoster();
    });
    hosterSearch.addEventListener("input", () => {
      const hidden = document.getElementById("serverHoster");
      const found = hosterBySlug(hidden.value);
      if (!found || hosterSearch.value.trim().toLowerCase() !== found[1].toLowerCase()) hidden.value = "";
      syncHosterChrome();
      openHoster();
    });
    hosterSearch.addEventListener("keydown", (event) => {
      const menu = document.getElementById("hosterMenu");
      const buttons = [...document.querySelectorAll("#hosterList button")];
      const current = buttons.findIndex((btn) => btn.classList.contains("is-active"));
      if (event.key === "ArrowDown" || event.key === "ArrowUp") {
        event.preventDefault();
        if (menu.hidden) openHoster();
        const list = [...document.querySelectorAll("#hosterList button")];
        if (!list.length) return;
        const next = event.key === "ArrowDown" ? current + 1 : (current < 0 ? list.length - 1 : current - 1);
        const idx = (next + list.length) % list.length;
        list.forEach((btn, i) => btn.classList.toggle("is-active", i === idx));
        list[idx].scrollIntoView({ block: "nearest" });
      } else if (event.key === "Enter" && !menu.hidden) {
        const list = [...document.querySelectorAll("#hosterList button")];
        const active = list.find((btn) => btn.classList.contains("is-active")) || (list.length === 1 ? list[0] : null);
        if (!active) return;
        event.preventDefault();
        selectHoster(active.dataset.slug);
        closeHoster();
      } else if (event.key === "Escape") {
        closeHoster();
        hosterSearch.blur();
      }
    });
    document.addEventListener("mousedown", (event) => {
      if (!document.getElementById("hosterPick").contains(event.target)) closeHoster();
    });

    showStep(1);
  </script>
</body>
</html>
